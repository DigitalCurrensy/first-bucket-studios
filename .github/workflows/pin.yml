name: Pin

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pin:
    name: House pin + visual loop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:pin
      - run: npm run test:vl
